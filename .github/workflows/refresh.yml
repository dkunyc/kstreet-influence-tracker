name: Monthly LDA Refresh

on:
  schedule:
    - cron: '0 6 5 * *'  # 5th of each month at 06:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion
        env:
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
        run: python ingestion/lda_ingest.py --years 2

      - name: Run dbt
        run: |
          cd dbt_project
          dbt deps
          dbt run
          dbt test
